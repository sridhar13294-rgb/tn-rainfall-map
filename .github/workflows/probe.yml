name: Probe data sources (one-off)
on:
  push:
    branches: [forecast-v2]
    paths: ['scripts/probe.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: pip install netCDF4 -q && python scripts/probe.py
      - run: |
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git diff --cached --quiet || git commit -m "Probe results"
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}

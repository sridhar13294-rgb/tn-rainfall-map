name: probe
on:
  push:
    branches: [radar-probe]
    paths: ['scripts/probe.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: python scripts/probe.py
        timeout-minutes: 45
      - if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar_probe
          git diff --cached --quiet || git commit -m "Probe results"
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}

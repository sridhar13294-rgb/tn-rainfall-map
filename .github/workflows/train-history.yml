name: Training history 2000-2019
on:
  push:
    branches: [train-data]
    paths: ['scripts/hist_gefs2.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tnsmart_old:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/hist_tnsmart.py 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/history/tnsmart data/history/stations_hist.json data/history/tnsmart_status.json || true
          git commit -qm "TN SMART history (NE monsoon 2000-2018)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin train-data && git push -q origin HEAD:train-data && break; sleep $((RANDOM % 20 + 5)); done
  gefs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        year: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pygrib
      - run: python scripts/hist_gefs2.py ${{ matrix.year }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/history/gefs || true
          git commit -qm "GEFS reforecast members and 850 hPa wind ${{ matrix.year }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin train-data && git push -q origin HEAD:train-data && break; sleep $((RANDOM % 30 + 5)); done

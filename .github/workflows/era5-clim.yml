name: Case studies ERA5 daily climatology (WeatherBench2 public copy)
on:
  push:
    branches: [cases]
    paths: ['data/cases/era5/CLIM']
permissions:
  contents: write
jobs:
  clim:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy xarray zarr gcsfs
      - run: python scripts/era5_clim_wb2.py || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cases/era5 || true
          git commit -qm "ERA5 daily climatology log" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep $((RANDOM % 20 + 5)); done

name: Daily rainfall update

on:
  schedule:
    - cron: '15 4 * * *'    # 09:45 IST, after TN SMART's 08:30 readings
    - cron: '30 12 * * *'   # 18:00 IST, catches late updates (same day is simply overwritten)
  workflow_dispatch:         # "Run workflow" button for a manual update
  push:
    branches: [main]
    paths: ['scripts/**', 'site/template.html', 'data/baseline.json', 'data/geo.json', 'data/match_overrides.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always start from the newest data, also when an old run is re-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch TN SMART and rebuild the map
        run: python scripts/update.py
      - name: Save the new data
        run: |
          git config user.name "rainfall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Rainfall update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase -X theirs origin main && git push origin HEAD:main   # newest run's files win
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: update
    concurrency:            # the rainfall and forecast robots publish one at a time
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

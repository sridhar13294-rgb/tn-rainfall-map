name: Weather forecast (experimental)

on:
  schedule:                  # GitHub only runs schedules on the main branch, so these start once merged
    - cron: '30 1 * * *'     # 07:00 IST (after GFS 00Z / ECMWF 00Z)
    - cron: '30 9 * * *'     # 15:00 IST (after GFS 06Z, ECMWF 06Z)
    - cron: '30 17 * * *'    # 23:00 IST (after GFS 12Z / ECMWF 12Z)
  workflow_dispatch:
  push:
    branches: [forecast]
    paths: ['scripts/forecast.py', 'site/forecast_template.html', '.github/workflows/forecast.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download model forecasts and build the page
        run: python scripts/forecast.py
      - name: Save the forecast
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/forecast.html data/forecast_status.json data/land_region.json || true
          git diff --cached --quiet || git commit -m "Forecast update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
      - if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:                   # only the live branch publishes the website
    if: github.ref_name == 'main'
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

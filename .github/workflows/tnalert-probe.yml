name: TN-ALERT rainfall fetch (branch tnalert)
# Fetches daily station rainfall from the TN-ALERT app's public 'Observed Rainfall' page for the dates in
# data/tnalert/dates.txt and saves them as data/daily/<date>.json on this branch (nothing goes to the website from here).
on:
  push:
    branches: [tnalert]
    paths: ['.github/workflows/tnalert-probe.yml', 'scripts/tnalert.py', 'data/tnalert/dates.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: tnalert}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/tnalert.py $(cat data/tnalert/dates.txt)
      - if: always()
        run: |
          git config user.name "rainfall-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily data/tnalert/log.json; git commit -m "TN-ALERT rainfall fetch $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" || exit 0
          for i in 1 2 3; do git pull --rebase origin tnalert && git push origin HEAD:tnalert && break; sleep 5; done

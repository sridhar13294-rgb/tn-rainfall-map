name: Case studies ERA5 from the public Google copy (no queue)
# Runs on the cases branch: add or change data/cases/era5/<batch>.arco (lines "name YYYY-MM-DD"); split over 4 runners.
on:
  push:
    branches: [cases]
    paths: ['data/cases/era5/*.arco']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
      SHARD: ${{ matrix.shard }}
      NSHARDS: 4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy xarray zarr gcsfs
      - run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'data/cases/era5/*.arco'); do python scripts/era5_arco.py "$f" || true; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cases/era5 || true
          git commit -qm "Case studies ERA5 (ARCO) logs, shard ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep $((RANDOM % 25 + 5)); done

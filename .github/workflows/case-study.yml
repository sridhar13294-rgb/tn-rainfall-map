name: Case study data (ECMWF analyses + IMD gridded rain)
# Runs on the cases branch: add or change data/cases/<name>.run containing "start end" (YYYY-MM-DD YYYY-MM-DD).
on:
  push:
    branches: [cases]
    paths: ['data/cases/*.run']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pygrib imdlib
      - name: Fetch every case whose .run file changed
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'data/cases/*.run'); do
            n=$(basename "$f" .run); read s e < "$f"; python scripts/case_fetch.py "$n" "$s" "$e" || true
          done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cases || true
          git commit -qm "Case study data" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep 7; done

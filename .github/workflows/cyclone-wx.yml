name: Model - general weather exam data
# Runs when data/cyclone/WX changes on cases: ERA5 truth + climate for 2020 starts every 5 days, ECMWF HRES scores on the
# same starts (WeatherBench2), and our model's start fields for those dates (libm_wx2020_fields.npz).
on:
  push:
    branches: [cases]
    paths: ['data/cyclone/WX']
permissions:
  contents: write
jobs:
  wx:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy scipy xarray zarr gcsfs
      - if: contains(github.event.head_commit.message, 'ECMWF scores only')
        run: |
          mkdir -p /tmp/cyc_out; gh release download era5-cases -p wx_truth_2020.npz -D /tmp/cyc_out
          WX_HRES_ONLY=1 python scripts/cyclone/cyc_wx.py || true
      - if: contains(github.event.head_commit.message, 'cycl2 library')
        run: |
          # 20 Nov: the Stage-1 storm-start library (Rule 1 intensity / tracks) WITH land fields incl. soil levels 2-4 - libm_fields.npz has
          # none (landinit falls back to air temperature and 60 % soil water), which would make any land-set exam unfair. NEW name cycL2
          mkdir -p /tmp/cyc_out
          LIBM_NAME=cycL2 python scripts/cyclone/cyc_libm.py > /tmp/libm_cycL2.out 2>&1 || true
          tail -5 /tmp/libm_cycL2.out; grep -i "source\|soil" /tmp/libm_cycL2.out | head -12 || true
          [ -f /tmp/cyc_out/libm_cycL2_fields.npz ] && gh release upload era5-cases /tmp/cyc_out/libm_cycL2_fields.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'land2 library')
        run: |
          # 19 Nov: the same 73 exam starts with ERA5 soil temperature levels 2-4 added (skin_ifs soil start), NEW name wx2020L2
          mkdir -p /tmp/cyc_out
          LIBM_TIMES=2020-01-01T00/2020-12-26T00/120 LIBM_NAME=wx2020L2 python scripts/cyclone/cyc_libm.py > /tmp/libm_wxL2.out 2>&1 || true
          tail -5 /tmp/libm_wxL2.out; grep -i "source\|soil" /tmp/libm_wxL2.out | head -12 || true
          [ -f /tmp/cyc_out/libm_wx2020L2_fields.npz ] && gh release upload era5-cases /tmp/cyc_out/libm_wx2020L2_fields.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'land library')
        run: |
          # 5 Nov: the same 73 exam starts WITH the ERA5 land state (soil water, soil/skin temperature, snow) under a NEW name;
          # the standard libm_wx2020_fields.npz is not touched (all existing results stay comparable)
          mkdir -p /tmp/cyc_out
          LIBM_TIMES=2020-01-01T00/2020-12-26T00/120 LIBM_NAME=wx2020L python scripts/cyclone/cyc_libm.py > /tmp/libm_wxL.out 2>&1 || true
          tail -5 /tmp/libm_wxL.out; grep -i "source\|land\|soil\|skin" /tmp/libm_wxL.out | head -12 || true
          [ -f /tmp/cyc_out/libm_wx2020L_fields.npz ] && gh release upload era5-cases /tmp/cyc_out/libm_wx2020L_fields.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'moist truth')
        run: |
          # 11 Nov: ERA5 humidity / cloud truth (q 925-500, t925, TCWV, cloud cover) for the exam days incl. day 0, under a NEW name
          mkdir -p /tmp/cyc_out
          python scripts/cyclone/cyc_moist.py || true
          [ -f /tmp/cyc_out/wx_truth_moist_2020.npz ] && gh release upload era5-cases /tmp/cyc_out/wx_truth_moist_2020.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'flux truth')
        run: |
          # 12 Nov: ERA5 surface/TOA energy fluxes + BL height, daily means of days 0-2 of every exam start, under a NEW name
          mkdir -p /tmp/cyc_out
          python scripts/cyclone/cyc_flux.py || true
          [ -f /tmp/cyc_out/flux_truth_2020.npz ] && gh release upload era5-cases /tmp/cyc_out/flux_truth_2020.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'rh truth')
        run: |
          # 12 Nov: ERA5 relative humidity 925-500 hPa and T 850/700, daily means of days 0-2 of every exam start (A: RH error vs cloud scheme)
          mkdir -p /tmp/cyc_out
          RH_MODE=1 python scripts/cyclone/cyc_flux.py || true
          [ -f /tmp/cyc_out/rh_truth_2020.npz ] && gh release upload era5-cases /tmp/cyc_out/rh_truth_2020.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'stress truth')
        run: |
          # 22 Nov: ERA5 turbulent + gravity-wave surface stress (A/P1 missing-drag check)
          python scripts/cyclone/cyc_stress.py || true
      - if: contains(github.event.head_commit.message, 'lhf truth')
        run: |
          # 22 Nov: ERA5 latent heat flux + rain over TN land, part-3 windows (P5b: is land evaporation the cause?)
          python scripts/cyclone/cyc_lhf.py || true
      - if: contains(github.event.head_commit.message, 'peak truth')
        run: |
          # 13 Nov: ERA5 0-72 h peak-intensity targets for every library storm (Stage-1 intensity rule 1)
          python scripts/cyclone/cyc_peak.py || true
      - if: contains(github.event.head_commit.message, 'bl truth')
        run: |
          # 14 Nov: 13-level start data vs ERA5 37 levels in the tropical boundary layer (A/P1 spin-up)
          python scripts/cyclone/cyc_bl.py || true
      - if: contains(github.event.head_commit.message, 'l37 fields')
        run: |
          # 14 Nov: start fields on all 29 ERA5 levels >= 50 hPa (A/P1: the 13-level start removes the tropical instability)
          mkdir -p /tmp/cyc_out
          LIBM_L37=1 LIBM_TIMES=2020-10-27T00/2020-11-06T00/120 LIBM_NAME=l37 python scripts/cyclone/cyc_libm.py || true
          [ -f /tmp/cyc_out/libm_l37_fields.npz ] && gh release upload era5-cases /tmp/cyc_out/libm_l37_fields.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'ml sub columns')
        run: |
          python scripts/cyclone/cyc_mlcol_sub.py || true
          [ -f /tmp/cyc_out/ml_columns_sub.npz ] && gh release upload era5-cases /tmp/cyc_out/ml_columns_sub.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'sfx truth')
        run: python scripts/cyclone/cyc_sfxsub.py || true
      - if: contains(github.event.head_commit.message, 'lcc truth')
        run: python scripts/cyclone/cyc_lcc.py || true
      - if: contains(github.event.head_commit.message, 'qadv700 truth')
        run: python scripts/cyclone/cyc_qadv700.py || true
      - if: contains(github.event.head_commit.message, 'cppole truth')
        run: python scripts/cyclone/cyc_cppole.py || true
      - if: contains(github.event.head_commit.message, 'adv700 truth')
        run: python scripts/cyclone/cyc_adv700.py || true
      - if: contains(github.event.head_commit.message, 'thsub truth')
        run: python scripts/cyclone/cyc_thsub.py || true
      - if: contains(github.event.head_commit.message, 'cpsub truth')
        run: python scripts/cyclone/cyc_cpsub.py || true
      - if: contains(github.event.head_commit.message, 'dt937 truth')
        run: python scripts/cyclone/cyc_dt937.py || true
      - if: contains(github.event.head_commit.message, 'adv truth')
        run: python scripts/cyclone/cyc_advsub.py || true
      - if: contains(github.event.head_commit.message, 'blhland truth')
        run: python scripts/cyclone/cyc_blhland.py || true
      - if: contains(github.event.head_commit.message, 'stab truth')
        run: python scripts/cyclone/cyc_stab.py || true
      - if: contains(github.event.head_commit.message, 'omsub truth')
        run: python scripts/cyclone/cyc_omsub.py || true
      - if: contains(github.event.head_commit.message, 'q1sub truth')
        run: python scripts/cyclone/cyc_q1sub.py || true
      - if: contains(github.event.head_commit.message, 'q2 truth')
        run: python scripts/cyclone/cyc_q2.py || true
      - if: contains(github.event.head_commit.message, 'stl truth')
        run: python scripts/cyclone/cyc_stl.py || true
      - if: contains(github.event.head_commit.message, 'shf hourly')
        run: python scripts/cyclone/cyc_shfhr.py || true
      - if: contains(github.event.head_commit.message, 'shf truth')
        run: python scripts/cyclone/cyc_shf.py || true
      - if: contains(github.event.head_commit.message, 'blh lcl')
        run: python scripts/cyclone/cyc_blhlcl.py || true
      - if: contains(github.event.head_commit.message, 'q1 truth')
        run: python scripts/cyclone/cyc_q1.py || true
      - if: contains(github.event.head_commit.message, 'cc hi truth')
        run: |
          python scripts/cyclone/cyc_cchi.py || true
          [ -f /tmp/cyc_out/cc_truth_hi_2020.npz ] && gh release upload era5-cases /tmp/cyc_out/cc_truth_hi_2020.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'blh global')
        run: python scripts/cyclone/cyc_blhg.py || true
      - if: contains(github.event.head_commit.message, 'rh tail')
        run: python scripts/cyclone/cyc_rhtail.py || true
      - if: contains(github.event.head_commit.message, 'cc truth')
        run: |
          python scripts/cyclone/cyc_cc.py || true
          [ -f /tmp/cyc_out/cc_truth_2020.npz ] && gh release upload era5-cases /tmp/cyc_out/cc_truth_2020.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'blh truth')
        run: python scripts/cyclone/cyc_blh.py || true
      - if: contains(github.event.head_commit.message, 'core rain')
        run: python scripts/cyclone/cyc_corerain.py || true
      - if: contains(github.event.head_commit.message, 'ml columns')
        run: |
          python scripts/cyclone/cyc_mlcol.py || true
          [ -f /tmp/cyc_out/ml_columns.npz ] && gh release upload era5-cases /tmp/cyc_out/ml_columns.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'veg fields')
        run: |
          # 22 Nov: ERA5 vegetation types/covers/monthly LAI for the IFS canopy resistance (P5b land_rs fix)
          mkdir -p /tmp/cyc_out
          python scripts/cyclone/cyc_veg.py || true
          [ -f /tmp/cyc_out/veg_static.npz ] && gh release upload era5-cases /tmp/cyc_out/veg_static.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'act6h jul')
        run: |
          # 22 Nov: ERA5 6-hourly, 48 h from 2020-06-29T00 (cooling-profile repeat, summer start)
          mkdir -p /tmp/cyc_out
          LIBM_TIMES=2020-06-29T00/2020-07-01T00/6 LIBM_NAME=act6hjul python scripts/cyclone/cyc_libm.py || true
          [ -f /tmp/cyc_out/libm_act6hjul_fields.npz ] && gh release upload era5-cases /tmp/cyc_out/libm_act6hjul_fields.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'act6h fields')
        run: |
          # 21 Nov: ERA5 6-hourly fields for 48 h from 2020-01-06T00 (day-1 activity / first-day adjustment reference)
          mkdir -p /tmp/cyc_out
          LIBM_TIMES=2020-01-06T00/2020-01-08T00/6 LIBM_NAME=act6h python scripts/cyclone/cyc_libm.py || true
          [ -f /tmp/cyc_out/libm_act6h_fields.npz ] && gh release upload era5-cases /tmp/cyc_out/libm_act6h_fields.npz --clobber || true
      - if: contains(github.event.head_commit.message, 'cp truth')
        run: |
          python scripts/cyclone/cyc_cp.py || true
          [ -f /tmp/cyc_out/cp_start.npz ] && gh release upload era5-cases /tmp/cyc_out/cp_start.npz --clobber || true
      - if: ${{ !contains(github.event.head_commit.message, 'cp truth') && !contains(github.event.head_commit.message, 'act6h fields') && !contains(github.event.head_commit.message, 'act6h jul') && !contains(github.event.head_commit.message, 'veg fields') && !contains(github.event.head_commit.message, 'lhf truth') && !contains(github.event.head_commit.message, 'stress truth') && !contains(github.event.head_commit.message, 'ml columns') && !contains(github.event.head_commit.message, 'core rain') && !contains(github.event.head_commit.message, 'blh truth') && !contains(github.event.head_commit.message, 'cc truth') && !contains(github.event.head_commit.message, 'rh tail') && !contains(github.event.head_commit.message, 'blh global') && !contains(github.event.head_commit.message, 'cc hi truth') && !contains(github.event.head_commit.message, 'q1 truth') && !contains(github.event.head_commit.message, 'blh lcl') && !contains(github.event.head_commit.message, 'shf truth') && !contains(github.event.head_commit.message, 'shf hourly') && !contains(github.event.head_commit.message, 'stl truth') && !contains(github.event.head_commit.message, 'q2 truth') && !contains(github.event.head_commit.message, 'q1sub truth') && !contains(github.event.head_commit.message, 'omsub truth') && !contains(github.event.head_commit.message, 'stab truth') && !contains(github.event.head_commit.message, 'blhland truth') && !contains(github.event.head_commit.message, 'adv truth') && !contains(github.event.head_commit.message, 'dt937 truth') && !contains(github.event.head_commit.message, 'cpsub truth') && !contains(github.event.head_commit.message, 'thsub truth') && !contains(github.event.head_commit.message, 'adv700 truth') && !contains(github.event.head_commit.message, 'cppole truth') && !contains(github.event.head_commit.message, 'qadv700 truth') && !contains(github.event.head_commit.message, 'lcc truth') && !contains(github.event.head_commit.message, 'sfx truth') && !contains(github.event.head_commit.message, 'ml sub columns') && !contains(github.event.head_commit.message, 'l37 fields') && !contains(github.event.head_commit.message, 'bl truth') && !contains(github.event.head_commit.message, 'ECMWF scores only') && !contains(github.event.head_commit.message, 'land library') && !contains(github.event.head_commit.message, 'land2 library') && !contains(github.event.head_commit.message, 'cycl2 library') && !contains(github.event.head_commit.message, 'moist truth') && !contains(github.event.head_commit.message, 'flux truth') && !contains(github.event.head_commit.message, 'rh truth') && !contains(github.event.head_commit.message, 'peak truth') }}
        run: |
          mkdir -p /tmp/cyc_out
          LIBM_TIMES=2020-01-01T00/2020-12-26T00/120 LIBM_NAME=wx2020 python scripts/cyclone/cyc_libm.py > /tmp/libm_wx.out 2>&1 &
          python scripts/cyclone/cyc_wx.py || true
          wait; tail -3 /tmp/libm_wx.out || true
          for f in /tmp/cyc_out/wx_truth_2020.npz /tmp/cyc_out/libm_wx2020_fields.npz; do [ -f $f ] && gh release upload era5-cases $f --clobber || true; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cyclone; git commit -qm "Model: general weather exam data" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep 15; done

name: Model - general weather exam data
# Runs when data/cyclone/WX changes on cases: ERA5 truth + climate for 2020 starts every 5 days, ECMWF HRES scores on the
# same starts (WeatherBench2), and our model's start fields for those dates (libm_wx2020_fields.npz).
on:
  push:
    branches: [cases]
    paths: ['data/cyclone/WX']
permissions:
  contents: write
jobs:
  wx:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy scipy xarray zarr gcsfs
      - run: |
          mkdir -p /tmp/cyc_out
          LIBM_TIMES=2020-01-01T00/2020-12-26T00/120 LIBM_NAME=wx2020 python scripts/cyclone/cyc_libm.py > /tmp/libm_wx.out 2>&1 &
          python scripts/cyclone/cyc_wx.py || true
          wait; tail -3 /tmp/libm_wx.out || true
          for f in /tmp/cyc_out/wx_truth_2020.npz /tmp/cyc_out/libm_wx2020_fields.npz; do [ -f $f ] && gh release upload era5-cases $f --clobber || true; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cyclone; git commit -qm "Model: general weather exam data" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep 15; done

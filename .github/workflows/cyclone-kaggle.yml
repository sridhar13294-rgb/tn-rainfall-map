name: Cyclone study - model on Kaggle GPU
# Runs when data/cyclone/KAGGLE changes on cases. Line 1: job name (slug). Line 2: input files from the era5-cases release
# (comma-separated). Line 3: command run inside repo/scripts/cyclone/mm on Kaggle. Line 4: accelerator (NvidiaTeslaT4,
# NvidiaTeslaP100, TpuV38; default NvidiaTeslaT4). Line 5: account 1-20 (1 = Sridhar's; 2-20 = KAGGLE2..20 secrets; default 1).
# Results go to data/cyclone/kaggle/<slug>/.
on:
  push:
    branches: [cases]
    paths: ['data/cyclone/KAGGLE']
permissions:
  contents: write
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - env:
          U1: ${{ secrets.KAGGLE_USERNAME }}
          T1: ${{ secrets.KAGGLE_API_TOKEN }}
          U2: ${{ secrets.KAGGLE2_USERNAME }}
          T2: ${{ secrets.KAGGLE2_API_TOKEN }}
          U3: ${{ secrets.KAGGLE3_USERNAME }}
          T3: ${{ secrets.KAGGLE3_API_TOKEN }}
          U4: ${{ secrets.KAGGLE4_USERNAME }}
          T4: ${{ secrets.KAGGLE4_API_TOKEN }}
          U5: ${{ secrets.KAGGLE5_USERNAME }}
          T5: ${{ secrets.KAGGLE5_API_TOKEN }}
          U6: ${{ secrets.KAGGLE6_USERNAME }}
          T6: ${{ secrets.KAGGLE6_API_TOKEN }}
          U7: ${{ secrets.KAGGLE7_USERNAME }}
          T7: ${{ secrets.KAGGLE7_API_TOKEN }}
          U8: ${{ secrets.KAGGLE8_USERNAME }}
          T8: ${{ secrets.KAGGLE8_API_TOKEN }}
          U9: ${{ secrets.KAGGLE9_USERNAME }}
          T9: ${{ secrets.KAGGLE9_API_TOKEN }}
          U10: ${{ secrets.KAGGLE10_USERNAME }}
          T10: ${{ secrets.KAGGLE10_API_TOKEN }}
          U11: ${{ secrets.KAGGLE11_USERNAME }}
          T11: ${{ secrets.KAGGLE11_API_TOKEN }}
          U12: ${{ secrets.KAGGLE12_USERNAME }}
          T12: ${{ secrets.KAGGLE12_API_TOKEN }}
          U13: ${{ secrets.KAGGLE13_USERNAME }}
          T13: ${{ secrets.KAGGLE13_API_TOKEN }}
          U14: ${{ secrets.KAGGLE14_USERNAME }}
          T14: ${{ secrets.KAGGLE14_API_TOKEN }}
          U15: ${{ secrets.KAGGLE15_USERNAME }}
          T15: ${{ secrets.KAGGLE15_API_TOKEN }}
          U16: ${{ secrets.KAGGLE16_USERNAME }}
          T16: ${{ secrets.KAGGLE16_API_TOKEN }}
          U17: ${{ secrets.KAGGLE17_USERNAME }}
          T17: ${{ secrets.KAGGLE17_API_TOKEN }}
          U18: ${{ secrets.KAGGLE18_USERNAME }}
          T18: ${{ secrets.KAGGLE18_API_TOKEN }}
          U19: ${{ secrets.KAGGLE19_USERNAME }}
          T19: ${{ secrets.KAGGLE19_API_TOKEN }}
          U20: ${{ secrets.KAGGLE20_USERNAME }}
          T20: ${{ secrets.KAGGLE20_API_TOKEN }}
        run: |
          A=$(sed -n 5p data/cyclone/KAGGLE | tr -d ' '); U=$U1; T=$T1
          case "$A" in 2) [ -n "$U2" ] && { U=$U2; T=$T2; };; 3) [ -n "$U3" ] && { U=$U3; T=$T3; };; 4) [ -n "$U4" ] && { U=$U4; T=$T4; };; 5) [ -n "$U5" ] && { U=$U5; T=$T5; };; 6) [ -n "$U6" ] && { U=$U6; T=$T6; };; 7) [ -n "$U7" ] && { U=$U7; T=$T7; };; 8) [ -n "$U8" ] && { U=$U8; T=$T8; };; 9) [ -n "$U9" ] && { U=$U9; T=$T9; };; 10) [ -n "$U10" ] && { U=$U10; T=$T10; };; 11) [ -n "$U11" ] && { U=$U11; T=$T11; };; 12) [ -n "$U12" ] && { U=$U12; T=$T12; };; 13) [ -n "$U13" ] && { U=$U13; T=$T13; };; 14) [ -n "$U14" ] && { U=$U14; T=$T14; };; 15) [ -n "$U15" ] && { U=$U15; T=$T15; };; 16) [ -n "$U16" ] && { U=$U16; T=$T16; };; 17) [ -n "$U17" ] && { U=$U17; T=$T17; };; 18) [ -n "$U18" ] && { U=$U18; T=$T18; };; 19) [ -n "$U19" ] && { U=$U19; T=$T19; };; 20) [ -n "$U20" ] && { U=$U20; T=$T20; };; esac
          if [ "$A" != "1" ] && [ -n "$A" ] && [ "$U" = "$U1" ]; then echo "account $A not configured - refusing to fall back to account 1"; exit 1; fi
          echo "::add-mask::$T"; { echo "KAGGLE_USERNAME=$U"; echo "KAGGLE_API_TOKEN=$T"; echo "KAGGLE_KEY=$T"; } >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -U kaggle && kaggle --version
      - run: |
          SLUG=$(sed -n 1p data/cyclone/KAGGLE | tr -d ' '); FILES=$(sed -n 2p data/cyclone/KAGGLE | tr -d ' '); JOB=$(sed -n 3p data/cyclone/KAGGLE)
          ACC=$(sed -n 4p data/cyclone/KAGGLE | tr -d ' '); [ -z "$ACC" ] && ACC=NvidiaTeslaT4
          echo "SLUG=$SLUG" >> $GITHUB_ENV; mkdir -p /tmp/k data/cyclone/kaggle/$SLUG
          python3 - "$SLUG" "$FILES" "$JOB" "$ACC" <<'PY'
          import sys, json, os
          slug, files, job, acc = sys.argv[1:5]
          src = open('scripts/cyclone/kaggle/kernel.py').read().replace('__JOB__', 'cd repo/scripts/cyclone/mm && ' + job.replace('"', '\\"')).replace('__FILES__', files).replace('__ACC__', acc)
          open('/tmp/k/kernel.py', 'w').write(src)
          tpu = acc.lower().startswith('tpu')
          json.dump(dict(id=os.environ['KAGGLE_USERNAME'] + '/' + slug, title=slug, code_file='kernel.py', language='python', kernel_type='script',
                         is_private=True, enable_gpu=not tpu, enable_tpu=tpu, enable_internet=True, machine_shape=acc,
                         dataset_sources=[], competition_sources=[], kernel_sources=[]), open('/tmp/k/kernel-metadata.json', 'w'), indent=1)
          PY
          cat /tmp/k/kernel-metadata.json | grep -v '"id"'
          if [ "$(echo $JOB | tr -d ' ')" = "COLLECT" ]; then echo "collect only: no push"; else (kaggle kernels push -p /tmp/k --accelerator $ACC || kaggle kernels push -p /tmp/k) 2>&1 | tee data/cyclone/kaggle/$SLUG/push.txt; fi   # line 3 COLLECT = fetch output of an already-run kernel
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$KAGGLE_USERNAME/$SLUG; D=data/cyclone/kaggle/$SLUG
          if grep -qi 'error' $D/push.txt 2>/dev/null; then echo "push refused: $(tail -1 $D/push.txt)" | tee -a $D/status.txt; exit 0; fi   # e.g. weekly GPU quota used up - stop instead of polling 6 h
          sleep 60
          for i in $(seq 1 110); do S=$(kaggle kernels status $ID 2>&1 | tail -1); echo "$(date -u +%H:%M) $S"; echo "$(date -u +%H:%M) $S" | sed "s#$KAGGLE_USERNAME#USER#g" >> $D/status.txt
            case "$S" in *COMPLETE*|*ERROR*|*CANCEL*|*complete*|*error*|*cancel*) break;; esac; sleep 300; done
          kaggle kernels output $ID -p /tmp/kout 2>&1 | tail -3 || true; ls -la /tmp/kout || true
          cp /tmp/kout/*.json $D/ 2>/dev/null || true; cp /tmp/kout/job.log $D/ 2>/dev/null || true; for f in /tmp/kout/*.log; do tail -c 30000 "$f" > $D/kernel_$(basename $f); done 2>/dev/null || true
          sed -i "s#$KAGGLE_USERNAME#USER#g" $D/* 2>/dev/null || true
          for f in /tmp/kout/*.npz; do [ -f "$f" ] || continue; gh release view model-maps >/dev/null 2>&1 || gh release create model-maps --title "Model map data" --notes "Forecast fields for the map viewer (from Kaggle jobs)" --target cases; gh release upload model-maps "$f" --clobber && echo "uploaded $(basename $f) to release model-maps" >> $D/status.txt; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cyclone/kaggle; git commit -qm "Cyclone study: Kaggle job $SLUG" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep 15; done

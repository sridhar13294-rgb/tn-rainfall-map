name: Case studies ERA5 source check
on:
  push:
    branches: [cases]
    paths: ['data/cases/era5/SOURCES']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy xarray zarr gcsfs s3fs h5py h5netcdf
      - run: python scripts/era5_sources.py || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cases/era5/sources.json || true
          git commit -qm "ERA5 source check" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep 9; done

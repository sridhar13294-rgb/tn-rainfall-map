name: Case studies ERA5 (reanalysis for big rain events)
# Runs on the cases branch.  Change data/cases/era5/PREP for the set-up run (probe, indices, IMD grid, climatology);
# add or change data/cases/era5/<batch>.list (lines "name YYYY-MM-DD") to fetch those events.
# Big files go to the release "era5-cases" (kept out of git); logs and small files are committed.
on:
  push:
    branches: [cases]
    paths: ['data/cases/era5/PREP', 'data/cases/era5/*.list']
permissions:
  contents: write
concurrency: {group: era5-cases, cancel-in-progress: false}
jobs:
  era5:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ECMWF_DS_KEY: ${{ secrets.ECMWF_DS_KEY }}
      CDS_KEY: ${{ secrets.CDS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pygrib imdlib "cdsapi>=0.7.7"
      - name: Release for the big files
        run: gh release view era5-cases >/dev/null 2>&1 || gh release create era5-cases --target cases --prerelease --title "Data: ERA5 case studies (not a site release)" --notes "Reanalysis files for the big-rain case studies. Not part of the website."
      - name: Set-up run
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^data/cases/era5/PREP$'; then
            python scripts/era5_prep.py || true
            [ -f /tmp/era5_clim_1991_2020.npz ] && gh release upload era5-cases /tmp/era5_clim_1991_2020.npz --clobber || true
          fi
      - name: Events
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'data/cases/era5/*.list'); do python scripts/era5_case.py "$f" || true; done
          for f in /tmp/era5_out/*.npz; do [ -f "$f" ] && gh release upload era5-cases "$f" --clobber || true; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cases/era5 || true
          git commit -qm "Case studies ERA5 data" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep $((RANDOM % 20 + 5)); done

name: Training history ECMWF TIGGE (2006-2022)
# Runs once the repository secret ECMWF_DS_KEY exists (personal access token from https://ecds.ecmwf.int with the TIGGE
# licence accepted). Start it by pushing a change to data/history/TIGGE_RUN on the train-data branch.
on:
  push:
    branches: [train-data]
    paths: ['data/history/TIGGE_RUN']
  workflow_dispatch:
    inputs:
      probe:
        description: 'Tiny test request only'
        default: ''
      years:
        description: 'Years as a JSON list'
        default: '[2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022]'
permissions:
  contents: write
jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.y.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: y
        run: echo "list=$(grep -o '\[[0-9, ]*\]' data/history/TIGGE_RUN 2>/dev/null | tr -d ' ' | head -1)" >> "$GITHUB_OUTPUT"
  tigge:
    needs: years
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJSON(inputs.years || needs.years.outputs.list || '[2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022]') }}
        month: [10, 11, 12]
    env:
      ECMWF_DS_KEY: ${{ secrets.ECMWF_DS_KEY }}
      TIGGE_PROBE: ${{ inputs.probe }}
      TIGGE_MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pygrib "cdsapi>=0.7.7"
      - run: python scripts/hist_tigge.py ${{ matrix.year }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/history/tigge || true
          git commit -qm "ECMWF TIGGE history ${{ matrix.year }}-${{ matrix.month }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin train-data && git push -q origin HEAD:train-data && break; sleep $((RANDOM % 30 + 5)); done

name: Probe training data (one-off)
on:
  push:
    branches: [train-probe]
    paths: ['scripts/probe_train.py', '.github/workflows/probe-train.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe_train.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/probe_train.json && git commit -m "Training data probe results" && git push origin HEAD:train-probe || true

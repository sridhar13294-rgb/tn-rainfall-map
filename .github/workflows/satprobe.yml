name: Satellite radar check vs IMD radar (sat-radar branch only)
on:
  push:
    branches: [sat-radar]
    paths: ['scripts/radarcheck.py', '.github/workflows/satprobe.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pillow matplotlib
      - run: python scripts/radarcheck.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/satradar
          git commit -m "Satellite radar check vs IMD radar" || true
          git push || true

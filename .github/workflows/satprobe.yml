name: Satellite radar test (sat-radar branch only)
on:
  push:
    branches: [sat-radar]
    paths: ['scripts/satprobe.py', 'scripts/satacc.py', '.github/workflows/satprobe.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pillow netCDF4
      - run: python scripts/satacc.py 2026-10-15 2026-10-14 2026-10-13 2026-10-12 2026-10-11 2026-10-10
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/satradar
          git commit -m "Satellite radar test results" || true
          git push || true

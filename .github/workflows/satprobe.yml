name: Satellite radar probe (sat-radar branch only)
on:
  push:
    branches: [sat-radar]
    paths: ['scripts/satprobe.py', '.github/workflows/satprobe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/satprobe.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/satradar
          git commit -m "Satellite radar probe results" || true
          git push || true

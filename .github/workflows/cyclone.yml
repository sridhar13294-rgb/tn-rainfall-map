name: Cyclone study (latest forecasts, best tracks, ERA5 steering winds)
# Runs on the cases branch when data/cyclone/RUN changes. The file's first word picks the jobs: "all", "fc", "ours" (live inputs for our own ensemble), "hist", "bg" (background fields for past storms), "lib" (ERA5 for the analogue library), "ocean" (WOA23 climatology + RTOFS ocean profiles) or "obs" (open observations for the model start: obs_fetch.py).
on:
  push:
    branches: [cases]
    paths: ['data/cyclone/RUN']
permissions:
  contents: write
jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
      EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
      EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      MOSDAC_USER: ${{ secrets.MOSDAC_USER }}
      MOSDAC_PASSWORD: ${{ secrets.MOSDAC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pygrib matplotlib scikit-learn scipy
      - run: pip install -q eccodes || true   # optional second GRIB decoder for the ICON/CMC fetch (centres_m.py); never blocks the job
      - run: pip install -q h5py || true      # NetCDF4 reader for the Met Office files (centres_m.py, UKMO); never blocks the job
      - run: |
          w=$(head -c 4 data/cyclone/RUN)
          if [ "$w" = "all " ] || [ "$w" = "fc" ] || [ "$w" = "fc " ]; then python scripts/cyclone/cyc_fetch.py $(sed -n 2p data/cyclone/RUN) || true; fi
          if [ "$w" = "ours" ]; then python scripts/cyclone/ours_fetch.py || true; fi
          if [ "$(head -n 1 data/cyclone/RUN | tr -d " ")" = "oursm" ]; then L2=$(sed -n 2p data/cyclone/RUN); if [ -z "$(echo $L2 | tr -d ' ')" ]; then python scripts/cyclone/ours_fetch_m.py || true; else for r in $L2; do python scripts/cyclone/ours_fetch_m.py $r || true; done; fi; fi   # line 2: one or more past runs
          if [ "$(head -n 1 data/cyclone/RUN | tr -d " ")" = "tigge" ]; then python scripts/cyclone/$(sed -n 2p data/cyclone/RUN) > data/cyclone/tigge_log.txt 2>&1 || true; fi
          # "obs": open observations for a run time (RUN line 2 = YYYYMMDDHH, empty = latest) -> obs_<run>.npz; log data/cyclone/obs_log.txt
          if [ "$(head -n 1 data/cyclone/RUN | tr -d " ")" = "probe2" ]; then python scripts/cyclone/obs_probe2.py || true; fi
          if [ "$(head -n 1 data/cyclone/RUN | tr -d " ")" = "obs" ]; then pip install -q netCDF4 || true; python scripts/cyclone/obs_fetch.py $(sed -n 2p data/cyclone/RUN | tr -d " ") || true; fi
          for f in /tmp/cyc_out/*.npz; do [ -f "$f" ] && gh release upload era5-cases "$f" --clobber || true; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cyclone || true
          git commit -qm "Cyclone study: forecast fetch log" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep $((RANDOM % 20 + 5)); done
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy xarray zarr gcsfs
      - run: |
          w=$(head -c 4 data/cyclone/RUN)
          if [ "$w" = "all " ] || [ "$w" = "hist" ]; then python scripts/cyclone/cyc_hist.py || true; fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          w=$(head -n 1 data/cyclone/RUN | tr -d ' ')
          if [ "$w" = "bg" ]; then python scripts/cyclone/cyc_bg.py || true; fi
          if [ "$w" = "lib" ]; then python scripts/cyclone/cyc_lib.py || true; fi
          if [ "$w" = "geo" ]; then python scripts/cyclone/geo_fetch.py || true; for f in /tmp/cyc_out/geo_gwd.npz /tmp/cyc_out/ozone_clim.npz; do [ -f $f ] && gh release upload era5-cases $f --clobber || true; done; fi   # sub-grid orography (GWD/blocking) + ozone climatology
          if [ "$w" = "libh" ]; then python scripts/cyclone/cyc_libh.py || true; fi
          if [ "$w" = "libm" ]; then python scripts/cyclone/cyc_libm.py || true; fi
          if [ "$w" = "libm48" ]; then LIBM_LEAD=48 python scripts/cyclone/cyc_libm.py || true; fi
          if [ "$w" = "liball" ]; then
            # whole-Indian-Ocean storm list (IBTrACS 1980-2025) + start fields in chunks, fetched in parallel.
            # RUN line 2: specs name=BASINS:YEARS, e.g. "bb1=BB:1980-1999 as1=AS:1980-2025 si1=SI:1980-1999"
            python scripts/cyclone/cyc_lib_all.py || true
            for spec in $(sed -n 2p data/cyclone/RUN); do n=${spec%%=*}; sel=${spec#*=}
              LIBM_LIST=data/cyclone/lib_all.json LIBM_SEL=$sel LIBM_NAME=$n python scripts/cyclone/cyc_libm.py > /tmp/libm_$n.out 2>&1 &
            done; wait; tail -n 3 /tmp/libm_*.out || true
          fi
          if [ "$w" = "ocean" ]; then pip install -q netCDF4 && python scripts/cyclone/cyc_ocean.py || true; fi
          for f in /tmp/cyc_out/bg_fields.npz /tmp/cyc_out/lib_fields.npz /tmp/cyc_out/libh_fields.npz /tmp/cyc_out/libm_fields.npz /tmp/cyc_out/libm48_fields.npz /tmp/cyc_out/ocean_clim.npz /tmp/cyc_out/ocean_live.npz /tmp/cyc_out/libm_*_fields.npz; do [ -f $f ] && gh release upload era5-cases $f --clobber || true; done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cyclone || true
          git commit -qm "Cyclone study: best tracks and ERA5 steering winds" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin cases && git push -q origin HEAD:cases && break; sleep $((RANDOM % 20 + 5)); done
